name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l . )" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  # Catches Dockerfile / compose regressions on every PR and push to main,
  # instead of at tag-push time (when release.yml builds the image).
  # Nothing is pushed: both images build only, compose only validates.
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build gateway image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false

      # The dashboard Dockerfile builds hermetically from vendor/
      # (GOPROXY=off); generate the tree first, exactly as a local
      # builder would with `go mod vendor`.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vendor dependencies
        run: go mod vendor

      - name: Build dashboard image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.dashboard
          platforms: linux/amd64
          push: false

      # Compose validation needs the env files the compose file references
      # (deploy/.env); dummy values suffice — config renders, nothing runs.
      # --profile dashboard validates both services.
      - name: Validate compose file
        run: |
          printf 'ADMIN_KEY=dummy\nAPI_KEYS=dummy\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml --profile dashboard config -q
